upstream django {
    server django_gamma:8000;
}

server {
    listen 80;
    server_name gamma.careerpiter.ru oauth-tg.gamma.careerpiter.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gamma.careerpiter.ru;

    ssl_certificate /etc/letsencrypt/live/gamma.careerpiter.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamma.careerpiter.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location /static/ {
        alias /gamma/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /gamma/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Telegram JS proxy — обход блокировки telegram.org
    location /tg-js/ {
        proxy_pass https://telegram.org/js/;
        proxy_set_header Host telegram.org;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }
}

# Прокси всех Telegram-ресурсов через поддомен
server {
    listen 443 ssl;
    http2 on;
    server_name oauth-tg.gamma.careerpiter.ru;

    ssl_certificate /etc/letsencrypt/live/oauth-tg.gamma.careerpiter.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oauth-tg.gamma.careerpiter.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Прокси telegram.org (статику страницы OAuth, JS, CSS)
    location /tg/ {
        proxy_pass https://telegram.org/;
        proxy_set_header Host telegram.org;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Прокси cdn.telegram.org (аватарки, файлы)
    location /cdn/ {
        proxy_pass https://cdn.telegram.org/;
        proxy_set_header Host cdn.telegram.org;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Прокси t.me (аватарки в формате t.me/i/userpic)
    location /tme/ {
        proxy_pass https://t.me/;
        proxy_set_header Host t.me;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Прокси oauth.telegram.org с перезаписью абсолютных URL
    location / {
        proxy_pass https://oauth.telegram.org/;
        proxy_set_header Host oauth.telegram.org;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # Отключаем сжатие, чтобы sub_filter мог переписать URL
        proxy_set_header Accept-Encoding "";

        # Переписываем все абсолютные URL Telegram в ответах
        sub_filter_once off;
        sub_filter 'https://oauth.telegram.org/' 'https://oauth-tg.gamma.careerpiter.ru/';
        sub_filter 'https://telegram.org/' 'https://oauth-tg.gamma.careerpiter.ru/tg/';
        sub_filter 'https://cdn.telegram.org/' 'https://oauth-tg.gamma.careerpiter.ru/cdn/';
        sub_filter 'https://t.me/' 'https://oauth-tg.gamma.careerpiter.ru/tme/';
        sub_filter_type text/html;

        proxy_redirect https://oauth.telegram.org/ /;
        proxy_cookie_domain oauth.telegram.org $host;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
