upstream django {
    server django_gamma:8000;
}

server {
    listen 80;
    server_name gamma.careerpiter.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gamma.careerpiter.ru;

    ssl_certificate /etc/letsencrypt/live/gamma.careerpiter.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamma.careerpiter.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location /static/ {
        alias /gamma/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /gamma/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }
}
