{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VPN Mini-App</title>
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- Roboto Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="app-container">
        
        <!-- Header -->
        <header class="app-header">
            <h1 id="page-title">Тарифы</h1>
        </header>

        <!-- Main Content Area -->
        <main class="views">
            <!-- View: Tariffs -->
            {% include "shop/tariffs.html" %}

            <!-- View: Connection -->
            {% include "connect/connection.html" %}

            <!-- View: Settings -->
            {% include "user/settings.html" %}

            <!-- View: Profile -->
            {% include "user/profile.html" %}
        </main>

        <!-- Bottom / Side Navigation -->
        <nav class="bottom-nav">
            <div class="nav-pill">
                <div class="nav-indicator"></div>
                <div class="nav-item active" data-target="view-tariffs" data-title="Тарифы">
                    <span class="material-symbols-rounded">shopping_cart</span>
                </div>
                <div class="nav-item" data-target="view-connection" data-title="Подключение">
                    <span class="material-symbols-rounded">vpn_key</span>
                </div>
                <div class="nav-item" data-target="view-settings" data-title="Настройки">
                    <span class="material-symbols-rounded">settings</span>
                </div>
            </div>
            
            <div class="nav-profile">
                <div class="nav-item" data-target="view-profile" data-title="Профиль">
                    <span class="material-symbols-rounded">person</span>
                </div>
            </div>
        </nav>
    </div>

    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
