{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вход — Gamma</title>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
        }
        .login-card {
            text-align: center;
            width: 90%;
            max-width: 320px;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .logo-box {
            width: 120px;
            height: 120px;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 40px;
        }
        /* Perfect Minimalist Node Gamma ɣ */
        .gamma-svg {
            width: 80px;
            height: 80px;
        }
        .gamma-path {
            stroke: #FFFFFF;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        h1 {
            font-size: 24px;
            font-weight: 500;
            color: #FFFFFF;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 48px;
        }
        .login-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            height: 54px;
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border-radius: 18px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }
        .login-button:hover {
            filter: brightness(1.1);
        }
        .login-button:active {
            transform: scale(0.98);
        }
        .tg-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box">
            <img src="{% static 'icons/logo.jpg' %}" alt="Logo" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
        </div>
        <h1>Gamma</h1>
        <p>Авторизация через Telegram</p>
        
        <a href="{{ auth_url }}" class="login-button">
            <svg class="tg-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 24C18.6274 24 24 18.6274 24 12C24 5.37258 18.6274 0 12 0C5.37258 0 0 5.37258 0 12C0 18.6274 5.37258 24 12 24Z" fill="currentColor" opacity="0.15"/>
                <path d="M5.3999 12.6001L8.5999 14.8001L9.7999 18.8001L11.5999 15.6001L15.9999 19.0001L18.7999 5.0001L5.3999 12.6001ZM10.2 14.2L15 9.4001L11.2 14.8L10.2 14.2Z" fill="currentColor"/>
            </svg>
            Войти через Telegram
        </a>

        {% if error %}
        <p style="color: #FFB4AB; margin-top: 24px; font-size: 13px;">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
