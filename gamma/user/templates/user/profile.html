<div id="view-profile" class="view">
    <div class="view-content-wrapper">
        <div class="profile-header">
            <div class="avatar" id="profile-avatar">
                <span class="material-symbols-rounded">person</span>
            </div>
            <div class="user-info">
                <h2 id="profile-name">Имя пользователя</h2>
                <span class="userid" id="profile-userid">ID: Загрузка...</span>
            </div>
        </div>

        <div class="balance-card">
            <span class="label">Ваш баланс</span>
            <div class="amount">0.00 ₽</div>
            <button class="topup-btn bounce">Пополнить</button>
        </div>

        <div class="settings-list">
            <div class="settings-item bounce">
                <span class="material-symbols-rounded">history</span>
                <span>История платежей</span>
                <span class="material-symbols-rounded arrow">chevron_right</span>
            </div>
            <div class="settings-item bounce">
                <span class="material-symbols-rounded">help</span>
                <span>Поддержка</span>
                <span class="material-symbols-rounded arrow">chevron_right</span>
            </div>
        </div>
    </div>
</div>
