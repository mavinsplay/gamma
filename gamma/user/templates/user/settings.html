<div id="view-settings" class="view">
    <div class="view-content-wrapper">
        <div class="settings-card">
            <div class="section">
                <h2>Мои устройства (HWID)</h2>
                <div class="device-list">
                    <div class="device-item">
                        <span class="material-symbols-rounded">smartphone</span>
                        <div class="device-details">
                            <span class="device-name">iPhone 13 Pro</span>
                            <span class="device-hwid">ID: 8F2A...9C41</span>
                        </div>
                        <span class="material-symbols-rounded action-icon">delete</span>
                    </div>
                    <div class="device-item">
                        <span class="material-symbols-rounded">computer</span>
                        <div class="device-details">
                            <span class="device-name">MacBook Air M1</span>
                            <span class="device-hwid">ID: 3B9E...7D22</span>
                        </div>
                        <span class="material-symbols-rounded action-icon">delete</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="settings-card">
            <div class="section">
                <h2>Дополнительные пользователи</h2>
                <button class="action-btn bounce">
                    <span class="material-symbols-rounded">person_add</span>
                    Купить доп. слот (100 ₽)
                </button>
            </div>
        </div>
    </div>
</div>
