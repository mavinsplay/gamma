<div id="view-tariffs" class="view active">
    <div class="card-list">
        {% for tariff in tariffs %}
        <div class="tariff-card bounce {% if forloop.first %}highlight{% endif %}">
            {% if forloop.first %}<div class="badge">Выгодно</div>{% endif %}
            <div class="card-header">
                <span class="material-symbols-rounded icon">rocket_launch</span>
                <h3>{{ tariff.name }}</h3>
            </div>
            <p class="description">{{ tariff.description }}</p>
            <div class="price">{{ tariff.price|floatformat:0 }} ₽ <span>/ {{ tariff.duration_days }} дней</span></div>
            <a href="{% url 'checkout' tariff.id %}" class="action-btn bounce" style="margin-top: 16px; text-decoration: none;">Купить</a>
        </div>
        {% empty %}
        <div style="text-align: center; margin-top: 50px; opacity: 0.7;">
            <span class="material-symbols-rounded" style="font-size: 48px;">hourglass_empty</span>
            <p>Тарифы пока не добавлены.</p>
        </div>
        {% endfor %}
    </div>
</div>
