{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ошибка</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="app-container" style="padding: 24px; overflow-y: auto; justify-content: center; text-align: center;">
        <span class="material-symbols-rounded" style="font-size: 64px; color: var(--md-sys-color-error); margin-bottom: 16px;">error</span>
        <h1 style="font-size: 24px; margin-bottom: 16px;">Произошла ошибка</h1>
        <p style="margin-bottom: 24px; color: var(--md-sys-color-on-surface-variant);">
            При создании подписки возникла ошибка. Деньги не были списаны.<br><br>
            <code style="font-size: 12px; color: #ff8a80;">{{ error }}</code>
        </p>
        <a href="{% url 'home' %}" class="action-btn bounce" style="text-decoration: none; background-color: var(--panel-bg);">Вернуться на главную</a>
    </div>
</body>
</html>
