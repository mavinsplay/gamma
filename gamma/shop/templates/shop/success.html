{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оплата успешна</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="app-container" style="padding: 24px; overflow-y: auto;">
        <div style="max-width: 600px; margin: 0 auto; width: 100%; text-align: center; padding-top: 40px;">
            <div style="width: 80px; height: 80px; background-color: rgba(129, 199, 132, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;">
                <span class="material-symbols-rounded" style="font-size: 48px; color: #81C784;">task_alt</span>
            </div>
            
            <h1 style="font-size: 28px; margin-bottom: 16px;">Спасибо за покупку!</h1>
            <p style="color: var(--md-sys-color-on-surface-variant); margin-bottom: 32px;">Ваш VPN успешно создан и готов к использованию.</p>
            
            <div class="settings-card" style="text-align: left; margin-bottom: 24px;">
                <h2 style="font-size: 16px; margin-bottom: 12px; color: var(--md-sys-color-primary);">Ваша ссылка (Ключ подписки)</h2>
                <div style="background-color: rgba(0,0,0,0.2); padding: 16px; border-radius: 12px; word-break: break-all; font-family: monospace; font-size: 14px; margin-bottom: 16px;">
                    {{ sub.subscription_url }}
                </div>
                <button class="action-btn bounce" onclick="navigator.clipboard.writeText('{{ sub.subscription_url }}'); alert('Скопировано!');">
                    <span class="material-symbols-rounded">content_copy</span>
                    Скопировать ключ
                </button>
            </div>

            <a href="{% url 'home' %}" class="action-btn bounce" style="text-decoration: none; background-color: var(--panel-bg);">
                <span class="material-symbols-rounded">home</span>
                Вернуться в приложение
            </a>
        </div>
    </div>
</body>
</html>
