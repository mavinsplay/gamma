<div id="view-history" class="view">
    <div class="view-content-wrapper">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
            <button class="bounce" onclick="activateTabById('view-profile', 'Профиль')" style="background: rgba(255,255,255,0.05); border: none; border-radius: 12px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #FFFFFF;">
                <span class="material-symbols-rounded">arrow_back</span>
            </button>
            <h3 style="font-size: 18px; font-weight: 500;">История платежей</h3>
        </div>

        <div class="history-list" id="history-list-container" style="display: flex; flex-direction: column; gap: 12px;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px 20px; opacity: 0.4; text-align: center;">
                <div class="spinner"></div>
                <span>Загрузка...</span>
            </div>
        </div>
        <div id="history-load-more" style="display: none; text-align: center; margin-top: 12px;">
            <button class="action-btn bounce" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 12px 24px; color: #fff;" onclick="loadMorePayments()">
                <span class="material-symbols-rounded" style="font-size: 18px;">expand_more</span>
                Показать ещё
            </button>
        </div>
    </div>
</div>
