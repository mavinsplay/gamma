<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открытие Gamma...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            background: #1C1B1F;
            color: #E6E1E5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
            gap: 20px;
        }
        .icon {
            width: 72px; height: 72px;
            background: rgba(208, 188, 255, 0.1);
            border-radius: 22px;
            display: flex; align-items: center; justify-content: center;
            font-size: 36px;
        }
        h1 { font-size: 22px; font-weight: 600; }
        p  { font-size: 14px; color: rgba(230,225,229,0.6); line-height: 1.5; }
        a.open-btn {
            display: inline-flex; align-items: center; gap: 10px;
            background: #D0BCFF; color: #381E72;
            border-radius: 16px; padding: 14px 28px;
            font-size: 16px; font-weight: 600;
            text-decoration: none; margin-top: 8px;
        }
        a.open-btn:active { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="icon">🔗</div>
    <h1>Открытие Happ...</h1>
    <p>Если приложение не открылось автоматически,<br>нажмите кнопку ниже.</p>
    <a class="open-btn" href="{{ happ_link }}">Открыть в Happ</a>
    <script>
        // Auto-redirect to happ:// deep link
        (function() {
            var link = {{ happ_link_json|safe }};
            setTimeout(function() {
                window.location.href = link;
            }, 300);
        })();
    </script>
</body>
</html>
